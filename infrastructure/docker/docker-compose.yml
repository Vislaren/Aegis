# Local development stack. Development-only credentials below are documented, non-secret values
# for this compose file only. Deployed environments use managed secrets (see
# docs/operations/environment-variables.md).
#
#   pnpm infra:up      -> data stores, broker, mail capture (profile: default)
#   pnpm stack:up      -> plus every Phase 1 service container (profile: services)

name: aegis

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: aegis_superuser
      POSTGRES_PASSWORD: aegis_superuser_dev
      POSTGRES_DB: postgres
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis_superuser -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aegis
      RABBITMQ_DEFAULT_PASS: aegis_dev
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']

  minio:
    profiles: ['storage']
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegis
      MINIO_ROOT_PASSWORD: aegis_minio_dev
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]

  # ---------- One-shot migrations (run as each database's owner role) ----------
  identity-migrate:
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: identity-service },
      }
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://identity_owner:identity_owner_dev@postgres:5432/aegis_identity
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'

  administration-migrate:
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: administration-service },
      }
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://administration_owner:administration_owner_dev@postgres:5432/aegis_administration
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'

  audit-migrate:
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: audit-service },
      }
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://audit_owner:audit_owner_dev@postgres:5432/aegis_audit
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'

  # ---------- Services ----------
  identity-service:
    <<: *service-defaults
    env_file: [services.env, identity-service.env]
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: identity-service },
      }
    environment:
      SERVICE_NAME: identity-service
      PORT: '3001'
      DATABASE_URL: postgresql://identity_app:identity_app_dev@postgres:5432/aegis_identity
      ADMINISTRATION_INTERNAL_URL: http://administration-service:3002
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  administration-service:
    <<: *service-defaults
    env_file: [services.env, administration-service.env]
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: administration-service },
      }
    environment:
      SERVICE_NAME: administration-service
      PORT: '3002'
      DATABASE_URL: postgresql://administration_app:administration_app_dev@postgres:5432/aegis_administration
      IDENTITY_INTERNAL_URL: http://identity-service:3001
    depends_on:
      administration-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  audit-service:
    <<: *service-defaults
    env_file: [services.env, audit-service.env]
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: audit-service },
      }
    environment:
      SERVICE_NAME: audit-service
      PORT: '3003'
      DATABASE_URL: postgresql://audit_app:audit_app_dev@postgres:5432/aegis_audit
      ADMINISTRATION_INTERNAL_URL: http://administration-service:3002
    depends_on:
      audit-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  realtime-gateway:
    <<: *service-defaults
    env_file: [services.env, realtime-gateway.env]
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: realtime-gateway },
      }
    environment:
      SERVICE_NAME: realtime-gateway
      PORT: '3004'
      ADMINISTRATION_INTERNAL_URL: http://administration-service:3002
      IDENTITY_INTERNAL_URL: http://identity-service:3001

  identity-worker:
    <<: *service-defaults
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: identity-service },
      }
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    env_file: [services.env, identity-service.env]
    environment:
      SERVICE_NAME: identity-service
      PORT: '3001'
      DATABASE_URL: postgresql://identity_app:identity_app_dev@postgres:5432/aegis_identity
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  administration-worker:
    <<: *service-defaults
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: administration-service },
      }
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    env_file: [services.env, administration-service.env]
    environment:
      SERVICE_NAME: administration-service
      PORT: '3002'
      DATABASE_URL: postgresql://administration_app:administration_app_dev@postgres:5432/aegis_administration
      IDENTITY_INTERNAL_URL: http://identity-service:3001
    depends_on:
      administration-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  audit-worker:
    <<: *service-defaults
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: audit-service },
      }
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    env_file: [services.env, audit-service.env]
    environment:
      SERVICE_NAME: audit-service
      PORT: '3003'
      DATABASE_URL: postgresql://audit_app:audit_app_dev@postgres:5432/aegis_audit
      ADMINISTRATION_INTERNAL_URL: http://administration-service:3002
    depends_on:
      audit-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  api-gateway:
    <<: *service-defaults
    env_file: [services.env]
    profiles: ['services']
    build:
      {
        context: ../..,
        dockerfile: infrastructure/docker/service.Dockerfile,
        args: { SERVICE: api-gateway },
      }
    environment:
      SERVICE_NAME: api-gateway
      PORT: '3000'
      IDENTITY_URL: http://identity-service:3001
      ADMINISTRATION_URL: http://administration-service:3002
      AUDIT_URL: http://audit-service:3003
      REALTIME_URL: http://realtime-gateway:3004
    ports: ['3000:3000']
    depends_on:
      identity-service: { condition: service_started }
      administration-service: { condition: service_started }
      audit-service: { condition: service_started }

volumes:
  postgres-data:
  minio-data:
